<!DOCTYPE html>
<html lang="en">

<head>
  <title>Federated Wiki Chess</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="./assets/styles/all.min.css" />
  <link rel="stylesheet" href="./assets/styles/screen.css" />
  <link rel="icon" href="icon-120.png" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>
  <div class="container-fluid">
    <div id="console-container" class="mb-3">
      <div class="row chess-console">
        <div class="chess-console-center col-xl-7 order-xl-2 col-lg-8 order-lg-1 order-md-1 col-md-12">
          <div class="chess-console-board"></div>
        </div>
        <div class="chess-console-right col-xl-3 order-xl-3 col-lg-4 order-lg-2 col-md-8 order-md-3">
          <div class="control-buttons buttons-grid mb-4"></div>
          <div class="chess-console-notifications mb-4"></div>
          <div class="engine-state mb-4"></div>
        </div>
        <div class="chess-console-left col-xl-2 order-xl-1 order-lg-3 col-lg-12 col-md-4 order-md-2">
          <div class="row">
            <div class="col-xl-12 col-lg-4 col-md-12 col-6">
              <div class="chess-console-history"></div>
            </div>
            <div class="col-xl-12 col-lg-8 col-md-12 col-6">
              <div class="chess-console-captured"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button id="sendMsg" class="btn btn-outline-primary mb-4" type="button">Send Msg</button>
    <form>
      <div class="input-group mb-4">
        <label for="fenInput" class="sr-only">FEN</label>
        <div class="input-group-prepend">
          <button id="fenButton" class="btn btn-outline-primary" type="button">Init with FEN</button>
        </div>
        <input id="fenInput" class="form-control" placeholder="FEN" value="4k2r/1P4P1/8/8/8/8/1p1N4/4K3 w - - 0 1" />
      </div>
    </form>
    Chess-Console code license: <a href="https://github.com/shaack/chess-console/blob/master/LICENSE" target="_blank">MIT</a>. <br />
    License for the Sounds: <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>. <br />
    License of the SVG pieces <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank">CC BY-SA
      3.0</a>.
    </p>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="./glitch-pwa.js"></script>
  <script src="./assets/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/jquery-3.3.1.slim.min.js"></script>
  <script src="./assets/js/es-module-shims.min.js"></script>

  <script type="module">
    import {
      ChessConsole, LocalPlayer, Board, GameStateOutput,
      History, CapturedPieces, HistoryControl, Persistence,
      Sound, StockfishGameControl, StockfishPlayer,
      StockfishStateView, StockfishNewGameDialog, I18n, FEN, Pgn
    } from "./cm-modules-bundle.js"

    let chessObj
    const msgTarget = window.opener || window.parent !== window.self ? window.parent : null; // Determine where to send messages

    window.addEventListener("DOMContentLoaded", () => {
      // Check if the page is loaded in a wiki
      if (msgTarget) {
        console.log("this is a wiki page")
        msgTarget.postMessage({ action: "get-state" }, window.origin)
      } else {
        console.log("this is a top level window, there is no wiki to send messages to!")
        //  TODO load a default game state here
        chessObj = {
          mode: "GAME",
          format: "PGN",
          PGN: `
            [SetUp "1"]
            [FEN "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"]`
        }

        initializeChess(chessObj); // Initialize chess with the chessObj
      }
    })

    // Receive messages from wiki
    window.addEventListener("message", event => {
      const { action, chessObj } = event.data
      switch (action) {
        case "load":
          console.log({ chessObj })
          if (chessObj.PGN) {
            chessConsole.initGame({ pgn: chessObj.PGN }) // Updated to use PGN property
          } else if (chessObj.FEN) {
            console.log("Need to load fen editor instead of chess-console")
          } else {
            console.log("Not sure how to handle this yet")
          }
          break
        case "send-state":
          console.log("I got the state!", chessObj)
          initializeChess(chessObj)
          // chessConsole.initGame({ pgn: chessObj.PGN }) // Updated to use PGN property
          break
        default:
          console.log("unknown message type:", action)
          console.log({ chessObj })
          break
      }
    })

    // Send messages to wiki
    document.getElementById("sendMsg").addEventListener("click", () => {
      if (msgTarget) {
        // const chessObj = {
        //   PGN: chessConsole.getPGN(),
        //   FEN: chessConsole.getFEN()
        // }
        msgTarget.postMessage({ action: "load", chessObj: { body: "test" } }, "*")
        console.log("sending message to wiki", { action: "load", chessObj: { body: "test" } })
      } else {
        // This is where the chess app is accessed directly, maybe as a PWA too.
        console.log("this is a top level window, there is no wiki to send messages to")
      }
    })

    function initializeChess(chessObj) {
      const i18n = new I18n()
      i18n.load({
        de: { playerName: "Spieler" },
        en: { playerName: "Player" },
        fr: { playerName: "Joueur" }
      })

      const chessConsole = new ChessConsole(
        document.getElementById("console-container"),
        // { name: i18n.t("playerName"), type: LocalPlayer },
        {
          name: "Stockfish Level 1", type: StockfishPlayer, props: {
            worker: "./assets/js/stockfish-niklasf-v10.js",
            book: "./assets/books/openings.bin",
            level: 1,
            debug: false
          }
        },
        {
          name: "Stockfish Level 5", type: StockfishPlayer, props: {
            worker: "./assets/js/stockfish-niklasf-v10.js",
            book: "./assets/books/openings.bin",
            level: 5,
            debug: false
          }
        })

      new Board(chessConsole, {
        assetsUrl: "./assets/",
        position: FEN.empty,
        style: {
          cssClass: "green",
          borderType: 'frame',
          showCoordinates: true,
          pieces: { file: "pieces/staunty.svg" }
        }
      }).initialized.then(() => {
        new Persistence(chessConsole, {
          savePrefix: "Stockfish"
        }).load()
        const pgny = new Pgn(chessObj.PGN)
        console.log({ pgny })
        chessConsole.initGame({ pgn: chessObj.PGN })
      })
      new History(chessConsole)
      new HistoryControl(chessConsole)
      new CapturedPieces(chessConsole)
      new StockfishGameControl(chessConsole, { player: chessConsole.opponent })
      new StockfishStateView(chessConsole, chessConsole.opponent)
      new GameStateOutput(chessConsole)
      new Sound(chessConsole, { soundSpriteFile: "./assets/sounds/chess_console_sounds.mp3" })

      console.log("HAHAHAHAH! we're in a function!")
    }

    // Change board position to fen
    document.getElementById("fenButton").addEventListener("click", () => {
      const fen = document.getElementById("fenInput").value
      const pgn = `
        [SetUp "1"]
        [FEN "${fen}"]`
      chessConsole.initGame({ pgn: pgn })
    })
  </script>
</body>

</html>
