<!DOCTYPE html>
<html lang="en">

<head>
  <title>Federated Wiki Chess</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="./assets/styles/all.min.css" />
  <link rel="stylesheet" href="./assets/styles/screen.css" />
  <link rel="icon" href="icon-120.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .page {
      display: none;
    }
  </style>
</head>

<body>
  <!-- GAME Page -->
  <div class="page container" id="game">
    <div class="container-fluid">
      <div id="console-container" class="mb-3">
        <div class="row chess-console">
          <div class="chess-console-center col-xl-7 order-xl-2 col-lg-8 order-lg-1 order-md-1 col-md-12">
            <div class="chess-console-board"></div>
          </div>
          <div class="chess-console-right col-xl-3 order-xl-3 col-lg-4 order-lg-2 col-md-8 order-md-3">
            <div class="control-buttons buttons-grid mb-4"></div>
            <div class="chess-console-notifications mb-4"></div>
            <div class="engine-state mb-4"></div>
          </div>
          <div class="chess-console-left col-xl-2 order-xl-1 order-lg-3 col-lg-12 col-md-4 order-md-2">
            <div class="row">
              <div class="col-xl-12 col-lg-4 col-md-12 col-6">
                <div class="chess-console-history"></div>
              </div>
              <div class="col-xl-12 col-lg-8 col-md-12 col-6">
                <div class="chess-console-captured"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button id="sendMsg" class="btn btn-outline-primary mb-4" type="button">Send Msg</button>
      <form>
        <div class="input-group mb-4">
          <label for="fenInput" class="sr-only">FEN</label>
          <div class="input-group-prepend">
            <button id="fenButton" class="btn btn-outline-primary" type="button">Init with FEN</button>
          </div>
          <input id="fenInput" class="form-control" placeholder="FEN" value="4k2r/1P4P1/8/8/8/8/1p1N4/4K3 w - - 0 1" />
        </div>
      </form>
      Chess-Console code license: <a href="https://github.com/shaack/chess-console/blob/master/LICENSE" target="_blank">MIT</a>. <br />
      License for the Sounds: <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>.
      <br />
      License of the SVG pieces <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank">CC BY-SA
        3.0</a>.
      </p>
    </div>
  </div>

  <!-- POSITION Page -->
  <div class="page container" id="position">
    <div class="container-fluid max-width-xxl">
      <br />
      <div class="cm-fen-editor">
        <div class="form-group row mb-3 g-3">
          <label for="fenInputOutput" class="col-auto col-form-label d-none d-md-block">FEN</label>
          <div class="col">
            <div class="input-group">
              <input type="text" class="form-control fen-input-output" id="fenInputOutput">
              <button class="btn btn-outline-secondary" type="button" id="copyFenBtn" title="Copy FEN">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="col-auto">
            <label for="positionSetUp" class="visually-hidden">Position setups</label>
            <select class="form-select fen-select" id="positionSetUp">
              <option disabled value=""></option>
              <option value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
                Starting Position
              </option>
              <option value="4k3/8/8/8/8/8/8/4K3 w - - 0 1">Kings Only</option>
              <option value="4k3/pppppppp/8/8/8/8/PPPPPPPP/4K3 w - - 0 1">Kings and Pawns</option>
              <option value="8/8/8/8/8/8/8/8 w - - 0 1">Empty Board</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-xl-7 col-md-7 mb-3">
            <div class="chessboard"></div>
          </div>
          <div class="col-xl-5 col-md-5">
            <div class="card conditions-inputs mb-3">
              <div class="card-header p-3">
                <div class="form-group mb-3">
                  <label for="colorToPlay" class="visually-hidden">Color to play</label>
                  <select class="form-select color-to-play" id="colorToPlay">
                    <option value="w">White to play</option>
                    <option value="b">Black to play</option>
                  </select>
                </div>
                <p class="mb-2">Allowed castling</p>
                <div class="row">
                  <div class="col-6 col-md-12 col-lg-6">
                    <div class="">
                      <input type="checkbox" name="castling" class="checkbox-castle checkbox-castle-wk" id="castle-wk" value="K">
                      <label class="custom-control-label" for="castle-wk">White O-O</label>
                    </div>
                    <div class="">
                      <input type="checkbox" name="castling" class="checkbox-castle checkbox-castle-wq" id="castle-wq" value="Q">
                      <label class="custom-control-label" for="castle-wq">White O-O-O</label>
                    </div>
                  </div>
                  <div class="col-6 col-md-12 col-lg-6">
                    <div class="">
                      <input type="checkbox" name="castling" class="checkbox-castle checkbox-castle-bk" id="castle-bk" value="k">
                      <label class="custom-control-label" for="castle-bk">Black O-O</label>
                    </div>
                    <div class="">
                      <input type="checkbox" name="castling" class="checkbox-castle checkbox-castle-bq" id="castle-bq" value="q">
                      <label class="custom-control-label" for="castle-bq">Black O-O-O</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-floating mb-3">
              <select class="form-select use-action" id="useAction">
                <option selected disabled value="">…</option>
                <option value="engine">Start Engine Game</option>
                <option disabled value="personalInvitation">Create personal invitation</option>
                <option disabled value="openInvitation">Create open invitation</option>
                <option disabled value="puzzle">Create chess problem in forum</option>
              </select>
              <label class="label" for="useAction">Use position</label>
            </div>
            <p class="text-muted">Click on an empty square to create a piece. Move a piece out of the board to remove
              it.</p>
          </div>
          <ul class="list-inline">
            <li class="list-inline-item">
              <a href="https://github.com/shaack/cm-fen-editor">GitHub repository</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>

<!-- SCRIPTS -->
<script type="module" src="./glitch-pwa.js"></script>
<script src="./assets/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/jquery-3.3.1.slim.min.js"></script>
<script src="./assets/js/bootstrap-auto-dark-mode.js"></script>
<script src="./assets/js/es-module-shims.min.js"></script>

<!-- Main chess script -->
<script type="module">
  import {
    ChessConsole, LocalPlayer, Board, GameStateOutput,
    History, CapturedPieces, HistoryControl, Persistence,
    Sound, StockfishGameControl, StockfishPlayer,
    StockfishStateView, StockfishNewGameDialog,
    I18n, FEN, Pgn, FenEditor, MARKER_TYPE
  } from "./cm-modules-bundle.js"

  let chessObj, chessConsole, fenEditor
  console.log("Chess Console loaded", ChessConsole)
  const msgTarget = window.opener || window.parent !== window.self ? window.parent : null; // Determine where to send messages

  window.addEventListener("DOMContentLoaded", () => {
    // Check if the page is loaded in a wiki
    if (msgTarget) {
      msgTarget.postMessage({ action: "get-state" }, window.origin)
    } else {
      console.log("this is a top level window, there is no wiki to send messages to!")
      //  TODO load a default game state here
      chessObj = {
        format: "PGN",
        PGN: `
            [SetUp "1"]
            [FEN "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"]`
      }

      chessObj.parsedPGN = new Pgn(chessObj.PGN)
      initializeChess(chessObj); // Initialize chess with the chessObj
    }
  })

  // Receive messages from wiki
  window.addEventListener("message", event => {
    const { action, chessObj } = event.data
    console.log(chessObj)
    chessObj.parsedPGN = new Pgn(chessObj.PGN)
    switch (action) {
      case "set-state":
        console.log("I got the state!", chessObj)
        initializeChess(chessObj)
        // chessConsole.initGame({ pgn: chessObj.PGN })
        break
      default:
        console.log("unknown message type:", action)
        console.log({ chessObj })
        break
    }
  })

  // Send messages to wiki
  function sendMessage(msg) {
    if (msgTarget) {
      console.log("sending message to wiki", msg)
      msgTarget.postMessage(msg, "*")
    } else {
      console.log("this is a top level window, there is no wiki to send messages to")
    }
  }
  // Send message to wiki when button is clicked
  document.getElementById("sendMsg").addEventListener("click", () => {
    sendMessage({ action: "refresh" })
  })

  function initializeChess(chessObj) {

    const i18n = new I18n()
    i18n.load({
      de: { playerName: "Spieler" },
      en: { playerName: "Player" },
      fr: { playerName: "Joueur" }
    })

    if (chessObj.PGN) {
      console.log("Initializing Chess Console with PGN")
      changePage("game") // Show the game page
      if (typeof chessConsole === "undefined") {
        console.log("I would like to show players", chessObj.parsedPGN.header.tags.Black, chessObj.parsedPGN.header.tags.White)
        let { player: whitePlayer, type: whiteType } = configurePlayer(chessObj.parsedPGN.header.tags.White)
        let { player: blackPlayer, type: blackType } = configurePlayer(chessObj.parsedPGN.header.tags.Black)
        console.log("White Player:", whitePlayer, "Type:", whiteType)
        console.log("Black Player:", blackPlayer, "Type:", blackType)
        chessConsole = new ChessConsole(
          document.getElementById("console-container"),
          whitePlayer,
          blackPlayer
        )

        new Board(chessConsole, {
          assetsUrl: "./assets/",
          position: FEN.empty,
          style: {
            cssClass: "green",
            borderType: 'frame',
            showCoordinates: true,
            pieces: { file: "pieces/staunty.svg" }
          }
        }).initialized.then(() => {
          new Persistence(chessConsole, {
            savePrefix: "Stockfish"
          }).load()

          chessConsole.initGame({ pgn: chessObj.PGN })
        })
        new History(chessConsole)
        new HistoryControl(chessConsole)
        new CapturedPieces(chessConsole)
        console.log(`Opponent: `, chessConsole.opponent)

        // if (whiteType === "stockfish" || blackType === "stockfish") {
        //   new StockfishGameControl(chessConsole, { player: chessConsole.opponent })
        //   new StockfishStateView(chessConsole, chessConsole.opponent)

        // }
        new GameStateOutput(chessConsole)
        new Sound(chessConsole, { soundSpriteFile: "./assets/sounds/chess_console_sounds.mp3" })

        console.log("HAHAHAHAH! we're in a function!")
      }
      else {
        console.log("Chess Console already initialized")
        chessConsole.initGame({ pgn: chessObj.PGN })
      }
    }
    else if (chessObj.FEN) {
      console.log("Initializing Chess Console with FEN")
      changePage("position") // Show the position page
      if (typeof fenEditor === "undefined") {
        fenEditor = new FenEditor(document.querySelector(".cm-fen-editor"), {
          boardTheme: "green",
          assetsUrl: "./assets/",
          piecesFile: "pieces/staunty.svg",
          markers: MARKER_TYPE.square,
          onFenChange: function (event) {
            // console.log("onFenChange", event)
          },
          onPositionChange: function (event) {
            // console.log("onPositionChange", event)
          }
        })
      }
      else {
        console.log("Fen Editor already initialized")
      }
    }
    else { // if format isn't know, start a standard game
      chessObj = {
        format: "PGN",
        PGN: `
            [SetUp "1"]
            [FEN "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"]`
      }
      initializeChess(chessObj); // Initialize chess with the chessObj
    }
  }

  function configurePlayer(name) {
    console.log(`Is Stockfish Level: `, name.slice(0, -1).toLowerCase().trim() === "stockfish level")
    console.log(`level num`, 1 <= name.slice(-1) <= 8)
    if (name.slice(0, -1).toLowerCase().trim() === "stockfish level" && 1 <= name.slice(-1) <= 8) {
      return {
        player: {
          name: name,
          type: StockfishPlayer,
          props: {
            worker: "./assets/js/stockfish-niklasf-v10.js",
            book: "./assets/books/openings.bin",
            level: parseInt(name.slice(-1)),
            debug: false
          }
        },
        type: "stockfish"
      }
    } else {
      return {
        player: {
          name: name,
          type: LocalPlayer
        },
        type: (window.location.hostname === name) ? "wiki" : "local"
      }

    }
  }

  // Change board position to fen
  document.getElementById("fenButton").addEventListener("click", () => {
    const fen = document.getElementById("fenInput").value
    const pgn = `
        [SetUp "1"]
        [FEN "${fen}"]`

    initializeChess({ format: "PGN", PGN: pgn }) // Initialize chess with the new FEN
  })

  // Copy to clipboard functionality
  document.getElementById('copyFenBtn').addEventListener('click', async () => {
    const fenInput = document.getElementById('fenInputOutput');
    try {
      await navigator.clipboard.writeText(fenInput.value);
      // Visual feedback
      const btn = document.getElementById('copyFenBtn');
      const icon = btn.querySelector('i');
      icon.classList.replace('fa-copy', 'fa-check');
      setTimeout(() => {
        icon.classList.replace('fa-check', 'fa-copy');
      }, 2000);
    } catch (err) {
      console.error('Failed to copy:', err);
    }
  })

  // Function for changing page content
  function changePage(page) {
    const pages = document.getElementsByClassName("page");
    // Hides all pages
    Array.prototype.forEach.call(pages, (page) => {
      page.style.display = "none";
    });
    // Shows the selected page
    document.getElementById(page).style.display = "block";
  }
</script>

</html>
